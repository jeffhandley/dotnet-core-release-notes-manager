name: Release Notes Manager

# Orchestration only: discover the in-scope release targets and produce one
# Release Notes Producer run per FEATURE target. Deterministic discovery (no
# agent), so this is a plain workflow. The producer is invoked as a reusable
# workflow (workflow_call) so it runs in this run's context and inherits the
# manager's actor, satisfying the producer's gh-aw activation role check.

on:
  schedule:
    - cron: "29 15 * * *" # daily, ~08:29 PT
  workflow_dispatch:
    inputs:
      milestone:
        description: "Optional milestone override for feature targets (e.g. rc1, ga). Empty = auto-derive."
        required: false
        type: string
      dry_run:
        description: "Compute and print targets without dispatching producers."
        required: false
        type: boolean
        default: false
  # Reactive: pull_request_review does NOT fire for draft PRs, and release-notes
  # PRs stay draft until a human takes over, so react to PR comments instead.
  # Comments the workflow posts via GITHUB_TOKEN do not re-trigger workflows, so
  # there is no comment loop (we also ignore bot comments defensively).
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: release-notes-manager
  cancel-in-progress: false

jobs:
  discover:
    name: Discover targets
    if: ${{ !github.event.repository.fork || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
      count: ${{ steps.discover.outputs.count }}
      feature_targets: ${{ steps.discover.outputs.feature_targets }}
      feature_count: ${{ steps.discover.outputs.feature_count }}
      servicing_target: ${{ steps.discover.outputs.servicing_target }}
      has_servicing: ${{ steps.discover.outputs.has_servicing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compute in-scope targets
        id: discover
        env:
          MILESTONE: ${{ inputs.milestone }}
        run: |
          set -euo pipefail
          targets="$(bash .github/scripts/release-notes-discover.sh)"
          count="$(jq 'length' <<<"$targets")"
          # The producer implements FEATURE targets only; servicing is skipped
          # until its producer path exists. Fan out over feature targets only.
          feature_targets="$(jq -c '[.[] | select(.mode == "feature")]' <<<"$targets")"
          feature_count="$(jq 'length' <<<"$feature_targets")"
          # The consolidated servicing target (at most one) is produced by a
          # separate servicing producer.
          servicing_target="$(jq -c 'map(select(.mode == "servicing")) | .[0] // empty' <<<"$targets")"
          if [ -n "$servicing_target" ]; then has_servicing=true; else has_servicing=false; fi
          echo "Discovered ${count} target(s); ${feature_count} feature, servicing=${has_servicing}:"
          jq '.' <<<"$targets"
          # Emit compact JSON for the dispatch matrix.
          {
            echo "targets<<__EOF__"
            jq -c '.' <<<"$targets"
            echo "__EOF__"
            echo "count=${count}"
            echo "feature_targets<<__EOF__"
            jq -c '.' <<<"$feature_targets"
            echo "__EOF__"
            echo "feature_count=${feature_count}"
            echo "servicing_target<<__EOF__"
            printf '%s\n' "${servicing_target:-}"
            echo "__EOF__"
            echo "has_servicing=${has_servicing}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Discovered targets (${count}; ${feature_count} feature)"
            echo '```json'
            jq '.' <<<"$targets"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  produce:
    name: Produce release notes
    needs: discover
    if: ${{ github.event_name != 'issue_comment' && needs.discover.outputs.feature_count != '0' && !inputs.dry_run }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.feature_targets) }}
    # Call the producer as a reusable workflow so it runs in this run's context
    # and inherits the manager's (human/schedule) actor, satisfying the
    # producer's gh-aw role check. (A GITHUB_TOKEN workflow_dispatch would run as
    # github-actions[bot], which has no repo role and fails activation.)
    uses: ./.github/workflows/release-notes-producer.lock.yml
    with:
      target: ${{ toJSON(matrix.target) }}
      milestone: ${{ inputs.milestone }}
    secrets: inherit

  produce_servicing:
    name: Produce servicing release notes
    needs: discover
    if: ${{ github.event_name != 'issue_comment' && needs.discover.outputs.has_servicing == 'true' && !inputs.dry_run }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      packages: read
    # One consolidated servicing target (all pending GA patches) -> the servicing
    # producer, invoked as a reusable workflow (same actor-inheritance rationale
    # as the feature producer above).
    uses: ./.github/workflows/release-notes-servicing-producer.lock.yml
    with:
      target: ${{ needs.discover.outputs.servicing_target }}
    secrets: inherit

  # ---- Reactive path (issue_comment on a draft release-notes PR) -------------
  reactive_resolve:
    name: Resolve commented PR to a target
    needs: discover
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      feature_target: ${{ steps.resolve.outputs.feature_target }}
      servicing_target: ${{ steps.resolve.outputs.servicing_target }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      TARGETS: ${{ needs.discover.outputs.targets }}
    steps:
      - name: Match the commented draft release-notes PR to a target
        id: resolve
        run: |
          set -euo pipefail
          feature_target=""
          servicing_target=""
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefName,title,isDraft,state 2>/dev/null || echo '{}')"
          head_ref="$(jq -r '.headRefName // empty' <<<"$pr_json")"
          title="$(jq -r '.title // empty' <<<"$pr_json")"
          is_draft="$(jq -r '.isDraft // false' <<<"$pr_json")"
          state="$(jq -r '.state // empty' <<<"$pr_json")"
          echo "PR #$PR_NUMBER head=$head_ref draft=$is_draft state=$state"
          # Only react to OPEN, DRAFT release-notes PRs (once a human marks a PR
          # Ready for Review it is human-owned and the producer leaves it alone).
          if [ "$state" = "OPEN" ] && [ "$is_draft" = "true" ] \
             && [ "${title#"[release-notes]"}" != "$title" ] \
             && [ "${head_ref#release-notes/}" != "$head_ref" ]; then
            if [ "$head_ref" = "release-notes/servicing" ]; then
              servicing_target="$(jq -c 'map(select(.mode == "servicing")) | .[0] // empty' <<<"$TARGETS")"
            else
              # The PR head is either the milestone features branch or a
              # <features-branch>-<component> branch; match the feature target
              # whose base_branch equals the head ref or is its prefix.
              feature_target="$(jq -c --arg h "$head_ref" '
                map(select(.mode == "feature"))
                | map(select(.base_branch as $b | .base_branch == $h or ($h | startswith($b + "-"))))
                | .[0] // empty' <<<"$TARGETS")"
            fi
          else
            echo "::notice::Comment is not on an open draft release-notes PR; nothing to do."
          fi
          {
            echo "feature_target<<__EOF__"; printf '%s\n' "${feature_target:-}"; echo "__EOF__"
            echo "servicing_target<<__EOF__"; printf '%s\n' "${servicing_target:-}"; echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

  reactive_feature:
    name: Reactive produce (feature)
    needs: reactive_resolve
    if: ${{ needs.reactive_resolve.outputs.feature_target != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      packages: read
    uses: ./.github/workflows/release-notes-producer.lock.yml
    with:
      target: ${{ needs.reactive_resolve.outputs.feature_target }}
    secrets: inherit

  reactive_servicing:
    name: Reactive produce (servicing)
    needs: reactive_resolve
    if: ${{ needs.reactive_resolve.outputs.servicing_target != '' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      packages: read
    uses: ./.github/workflows/release-notes-servicing-producer.lock.yml
    with:
      target: ${{ needs.reactive_resolve.outputs.servicing_target }}
    secrets: inherit
