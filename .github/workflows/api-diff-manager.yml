name: API Diff Manager

# Orchestration only: evaluate the dotnet/dotnet VMR to discover the active,
# not-yet-shipped release milestones and produce one API Diff Producer run per
# milestone. Deterministic discovery (no agent), so this is a plain workflow.
# The producer is invoked as a reusable workflow (workflow_call) so it runs in
# this run's context and inherits the manager's actor, satisfying the producer's
# gh-aw activation role check.

on:
  schedule:
    - cron: "17 13 * * *" # daily, ~06:17 PT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and print targets without dispatching producers."
        required: false
        type: boolean
        default: false
      simulate_from:
        description: "Optional: simulate generation by copying an existing milestone's api-diff (folder name, e.g. preview5)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-diff-manager
  cancel-in-progress: false

jobs:
  discover:
    name: Discover milestones
    if: ${{ !github.event.repository.fork || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
      count: ${{ steps.discover.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Discover API diff milestones from the VMR
        id: discover
        run: |
          set -euo pipefail
          targets="$(bash .github/scripts/api-diff-discover.sh)"
          count="$(jq 'length' <<<"$targets")"
          echo "Discovered ${count} milestone target(s):"
          jq '.' <<<"$targets"
          {
            echo "targets<<__EOF__"; jq -c '.' <<<"$targets"; echo "__EOF__"
            echo "count=${count}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Discovered ${count} API diff milestone(s)"
            echo '```json'; jq '.' <<<"$targets"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  produce:
    name: Produce API diff
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' && !inputs.dry_run }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    # Call the producer as a reusable workflow so it runs in this run's context
    # and inherits the manager's actor, satisfying the producer's gh-aw role
    # check. (A GITHUB_TOKEN workflow_dispatch would run as github-actions[bot],
    # which has no repo role and fails activation.)
    uses: ./.github/workflows/api-diff-producer.lock.yml
    with:
      target: ${{ toJSON(matrix.target) }}
      simulate_from: ${{ inputs.simulate_from }}
    secrets: inherit
